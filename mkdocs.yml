site_name: Purview Architecture Testing
site_description: Developer documentation for Purview Architecture Testing
repo_url: https://github.com/purview-dev/architests
edit_uri: edit/main/docs/
docs_dir: docs

nav:
  - Home: index.md
  - Getting started: Getting-Started.md
  - Policy reference: Policy-Reference.md
  - Type-level rules: Type-Level-Rules.md
  - API contracts: Contracts.md
  - Migration and budget: Migration.md
  - Command line: Cli.md
  - Extending: Extending.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
  features: [navigation.instant, navigation.sections, navigation.top, search.highlight, search.suggest, content.code.copy]

plugins: [search, techdocs-core]
markdown_extensions: [admonition, attr_list, md_in_html, pymdownx.details, pymdownx.superfences]
