name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release packages
    uses: purview-dev/build/.github/workflows/purview-release.yml@main
    with:
      # Keep in sync with `sdk.version` in global.json (and with pr.yml).
      dotnet-version: "11.0.100-rc.2.26504.105"
      release-mode: NuGet
      release-branch: main
    secrets: inherit
